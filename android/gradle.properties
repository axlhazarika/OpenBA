# android/gradle.properties -- docs/android/README.md.
#
# The app's identity: the package id (applicationId: the install name, the data folder
# /sdcard/Android/data/<id>/files, the adb commands of tools/android_*.sh) and the name under
# the launcher icon. Each is set here and nowhere else; a rename is one edit. The Java code's own
# package (org.openba.game, the activity class) is a source namespace and does not follow it.
openba.applicationId=org.openba.game
openba.appName=OpenBA

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
